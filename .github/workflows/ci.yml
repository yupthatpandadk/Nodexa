name: Nodexa CI

on:
  push:
    branches: [main, pterodactyl-core]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: PHP syntax
        run: find panel -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply production frontend transforms
        run: |
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/optimize-frontend-source.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/enable-managed-server-templates.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/enable-runtime-modules.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/enable-server-configuration-modules.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/enable-realtime-console.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/fix-installer-ready-ui.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/enable-power-feedback.sh"
          NODEXA_PANEL_DIR="$GITHUB_WORKSPACE/panel" bash "$GITHUB_WORKSPACE/deploy/optimize-frontend-delivery-source.sh"
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  laravel-runtime:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: nodexa_ci
          MARIADB_ROOT_PASSWORD: nodexa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          coverage: none
      - name: Build the same Laravel skeleton used by the installer
        run: |
          composer create-project laravel/laravel:^12.0 /tmp/nodexa-panel --no-interaction --prefer-dist --no-scripts
          cp -a panel/. /tmp/nodexa-panel/
          install -m 0644 panel/composer.json /tmp/nodexa-panel/composer.json
          cd /tmp/nodexa-panel
          rm -f composer.lock
          echo "Nodexa runtime composer constraint:"
          grep -A8 '"require"' composer.json
          composer update --no-interaction --prefer-dist --no-scripts
          cp .env.example .env
          APP_KEY_VALUE="base64:$(openssl rand -base64 32 | tr -d '\r\n')"
          if grep -q '^APP_KEY=' .env; then
            sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY_VALUE}|" .env
          else
            printf '\nAPP_KEY=%s\n' "$APP_KEY_VALUE" >> .env
          fi
          composer run-script post-autoload-dump
      - name: Run migrations and framework boot checks
        working-directory: /tmp/nodexa-panel
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nodexa_ci
          DB_USERNAME: root
          DB_PASSWORD: nodexa
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan migrate --force
          php artisan route:list
          php artisan config:cache
          php artisan view:cache

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve Agent dependencies
        run: go mod tidy
      - name: Build Agent
        run: go build ./cmd/nodexad
      - name: Test Agent packages
        run: go test ./...
