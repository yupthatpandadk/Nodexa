name: Nodexa Android APK

on:
  push:
    branches: [pterodactyl-core]
    paths:
      - 'android-app/**'
      - '.github/workflows/nodexa-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Kotlin compile hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dk/nodexa/app/MainActivity.kt')
          s = p.read_text()
          old = '                        "token expiring", "token expired" -> onLine("Console-forbindelsen skal fornyes.")\n                    }'
          new = '                        "token expiring", "token expired" -> onLine("Console-forbindelsen skal fornyes.")\n                        else -> Unit\n                    }'
          if old in s and 'else -> Unit' not in s[s.find('when (event)'):s.find('when (event)') + 700]:
              p.write_text(s.replace(old, new, 1))
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nodexa-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
