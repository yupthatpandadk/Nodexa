name: Nodexa Android APK

on:
  push:
    branches: [pterodactyl-core]
    paths:
      - 'android-app/**'
      - '.github/workflows/nodexa-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Android UI transforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/dk/nodexa/app/MainActivity.kt')
          s = p.read_text()

          s = s.replace('Icons.Default.HardDrive', 'Icons.Default.Storage')

          old = '                        "token expiring", "token expired" -> onLine("Console-forbindelsen skal fornyes.")\n                    }'
          new = '                        "token expiring", "token expired" -> onLine("Console-forbindelsen skal fornyes.")\n                        else -> Unit\n                    }'
          if old in s and 'else -> Unit' not in s[s.find('when (event)'):s.find('when (event)') + 700]:
              s = s.replace(old, new, 1)

          server_topbar = '        topBar = {\n            TopAppBar(\n                navigationIcon = { IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, null) } },\n                title = { Column { Text(server.name, fontWeight = FontWeight.Bold, fontSize = 18.sp); Text(server.id, color = Muted, fontSize = 11.sp) } },\n                colors = TopAppBarDefaults.topAppBarColors(containerColor = Bg)\n            )\n        },\n'
          s = s.replace(server_topbar, '')

          s = s.replace(
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(bottom = 24.dp))',
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(top = 12.dp, bottom = 28.dp))'
          )
          s = s.replace(
              'LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(bottom = 24.dp))',
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(top = 12.dp, bottom = 28.dp))'
          )
          s = s.replace(
              'Column(Modifier.fillMaxSize().padding(14.dp)) {',
              'Column(Modifier.fillMaxSize().padding(horizontal = 14.dp).padding(top = 12.dp, bottom = 10.dp)) {',
              1
          )
          files_marker = 'fun FilesPage(api: Api, server: Server) {'
          idx = s.find(files_marker)
          if idx != -1:
              tail = s[idx:]
              tail = tail.replace(
                  'Column(Modifier.fillMaxSize().padding(14.dp)) {',
                  'Column(Modifier.fillMaxSize().padding(horizontal = 14.dp).padding(top = 12.dp, bottom = 10.dp)) {',
                  1
              )
              s = s[:idx] + tail
          s = s.replace(
              'LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(bottom = 24.dp))',
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(top = 12.dp, bottom = 32.dp))'
          )
          s = s.replace('Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically)', 'Row(Modifier.padding(horizontal = 16.dp, vertical = 15.dp), verticalAlignment = Alignment.CenterVertically)')

          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nodexa-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
