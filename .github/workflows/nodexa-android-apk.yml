name: Nodexa Android APK

on:
  push:
    branches: [pterodactyl-core]
    paths:
      - 'android-app/**'
      - '.github/workflows/nodexa-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nodexa-android-debug-keystore-v1

      - name: Ensure persistent Android signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Nodexa,C=DK"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply Android UI transforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/dk/nodexa/app/MainActivity.kt')
          s = p.read_text()

          s = s.replace('Icons.Default.HardDrive', 'Icons.Default.Storage')

          # Remove the top app bar on the server list.
          server_list_start = s.find('fun ServerList(')
          server_card_start = s.find('fun ServerCard(', server_list_start)
          if server_list_start != -1 and server_card_start != -1:
              block = s[server_list_start:server_card_start]
              block = re.sub(
                  r'\n\s*topBar\s*=\s*\{\s*TopAppBar\([\s\S]*?\n\s*\}\s*,',
                  '',
                  block,
                  count=1,
              )
              s = s[:server_list_start] + block + s[server_card_start:]

          # Remove the top app bar inside an opened server.
          shell_start = s.find('fun ServerShell(')
          overview_start = s.find('fun Overview(', shell_start)
          if shell_start != -1 and overview_start != -1:
              block = s[shell_start:overview_start]
              block = re.sub(
                  r'\n\s*topBar\s*=\s*\{\s*TopAppBar\([\s\S]*?\n\s*\}\s*,',
                  '',
                  block,
                  count=1,
              )
              s = s[:shell_start] + block + s[overview_start:]

          # Keep content below Android's system status bar.
          s = s.replace(
              'Box(Modifier.padding(pad).fillMaxSize()) {',
              'Box(Modifier.padding(pad).fillMaxSize().statusBarsPadding()) {',
          )

          # Improve spacing once the large bars are gone.
          s = s.replace(
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(bottom = 24.dp))',
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(top = 8.dp, bottom = 28.dp))'
          )
          s = s.replace(
              'LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(bottom = 24.dp))',
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(12.dp), contentPadding = PaddingValues(top = 8.dp, bottom = 28.dp))'
          )
          s = s.replace(
              'Column(Modifier.fillMaxSize().padding(14.dp)) {',
              'Column(Modifier.fillMaxSize().padding(horizontal = 14.dp).padding(top = 8.dp, bottom = 10.dp)) {',
              1
          )

          files_marker = 'fun FilesPage(api: Api, server: Server) {'
          idx = s.find(files_marker)
          if idx != -1:
              tail = s[idx:]
              tail = tail.replace(
                  'Column(Modifier.fillMaxSize().padding(14.dp)) {',
                  'Column(Modifier.fillMaxSize().padding(horizontal = 14.dp).padding(top = 8.dp, bottom = 10.dp)) {',
                  1
              )
              s = s[:idx] + tail

          s = s.replace(
              'LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(bottom = 24.dp))',
              'LazyColumn(Modifier.fillMaxSize().padding(horizontal = 16.dp), verticalArrangement = Arrangement.spacedBy(10.dp), contentPadding = PaddingValues(top = 8.dp, bottom = 32.dp))'
          )

          p.write_text(s)
          PY

      - name: Verify top bars are gone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/dk/nodexa/app/MainActivity.kt').read_text()
          for fn, next_fn in [('fun ServerList(', 'fun ServerCard('), ('fun ServerShell(', 'fun Overview(')]:
              a = s.find(fn)
              b = s.find(next_fn, a)
              if a != -1 and b != -1 and 'topBar =' in s[a:b]:
                  raise SystemExit(f'Top bar still present in {fn}')
          print('Verified: top bars removed')
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nodexa-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
