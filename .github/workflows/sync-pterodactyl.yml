name: Sync Pterodactyl Upstream

on:
  workflow_dispatch:
  push:
    branches:
      - pterodactyl-core
    paths:
      - .github/workflows/sync-pterodactyl.yml
      - nodexa-overlay/**

permissions:
  contents: write

concurrency:
  group: nodexa-pterodactyl-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nodexa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream projects
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/nodexa-upstream
          mkdir -p /tmp/nodexa-upstream

          git clone --depth=1 https://github.com/pterodactyl/panel.git /tmp/nodexa-upstream/panel
          git clone --depth=1 https://github.com/pterodactyl/wings.git /tmp/nodexa-upstream/wings
          git clone --depth=1 https://github.com/pterodactyl-installer/pterodactyl-installer.git /tmp/nodexa-upstream/installer

          PANEL_SHA=$(git -C /tmp/nodexa-upstream/panel rev-parse HEAD)
          WINGS_SHA=$(git -C /tmp/nodexa-upstream/wings rev-parse HEAD)
          INSTALLER_SHA=$(git -C /tmp/nodexa-upstream/installer rev-parse HEAD)

          echo "PANEL_SHA=$PANEL_SHA" >> "$GITHUB_ENV"
          echo "WINGS_SHA=$WINGS_SHA" >> "$GITHUB_ENV"
          echo "INSTALLER_SHA=$INSTALLER_SHA" >> "$GITHUB_ENV"

      - name: Mirror upstream into Nodexa
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p panel wings upstream/pterodactyl-installer

          rsync -a --delete --exclude='.git' /tmp/nodexa-upstream/panel/ panel/
          rsync -a --delete --exclude='.git' /tmp/nodexa-upstream/wings/ wings/
          rsync -a --delete --exclude='.git' /tmp/nodexa-upstream/installer/ upstream/pterodactyl-installer/

      - name: Apply Nodexa overlay
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d nodexa-overlay/panel ]; then
            rsync -a nodexa-overlay/panel/ panel/
          fi
          if [ -d nodexa-overlay/wings ]; then
            rsync -a nodexa-overlay/wings/ wings/
          fi
          if [ -x scripts/apply-nodexa-overlay.sh ]; then
            scripts/apply-nodexa-overlay.sh
          fi

      - name: Write upstream lockfile
        shell: bash
        run: |
          cat > UPSTREAM.lock <<EOF
          # Nodexa upstream sources
          # Auto-generated by .github/workflows/sync-pterodactyl.yml
          panel_repository=https://github.com/pterodactyl/panel
          panel_commit=${PANEL_SHA}
          wings_repository=https://github.com/pterodactyl/wings
          wings_commit=${WINGS_SHA}
          installer_repository=https://github.com/pterodactyl-installer/pterodactyl-installer
          installer_commit=${INSTALLER_SHA}
          EOF

      - name: Commit synchronized source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "nodexa-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel wings upstream/pterodactyl-installer UPSTREAM.lock

          if git diff --cached --quiet; then
            echo "No upstream changes to commit."
            exit 0
          fi

          git commit -m "chore: sync Pterodactyl core into Nodexa"
          git push origin HEAD:pterodactyl-core
