name: Discord Runtime Check
on:
  push:
    paths: ['discord-bot/**']
  pull_request:
    paths: ['discord-bot/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: discord-bot
        run: npm install
      - working-directory: discord-bot
        run: npm run check
      - working-directory: discord-bot
        run: npm test
